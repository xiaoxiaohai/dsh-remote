name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - name: Run tests
        run: npm test
      - name: Check documentation
        run: npm run check:docs
      - name: Check for secrets and private operations data
        run: npm run check:secrets
      - name: Check whitespace
        run: git diff --check

  package:
    name: Reproducible package contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch pinned FRPC artifacts
        run: npm run fetch-frpc
      - name: Preview npm package without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts
      - name: Build and verify the exact npm tarball
        run: npm run pack:verify
