name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - name: Run tests
        run: npm test
      - name: Check documentation
        run: npm run check:docs
      - name: Check for secrets and private operations data
        run: npm run check:secrets
      - name: Check whitespace
        run: git diff --check

  package:
    name: Reproducible package contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Fetch pinned FRPC artifacts
        run: npm run fetch-frpc
      - name: Preview npm package without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts
      - name: Build and verify the exact npm tarball
        run: npm run pack:verify
